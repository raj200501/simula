# Every push: typecheck, the full test suite (unit + Playwright + the fixture pipeline end to end),
# then `npm run demo`, which runs every stage on the bundled fixture app with no device and no key.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test
      - name: demo (no device, no key)
        run: npm run demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-demo
          path: |
            out/demo/
          if-no-files-found: ignore
          retention-days: 14
